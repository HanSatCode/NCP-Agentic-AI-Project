# 진짜최종.zip — NGINX 설정 (http://공인IP/file-version/)
# 80번 포트의 기존 server { ... } 블록 안에 아래 location을 붙여 넣는다. 기존 index.html은 그대로 둔다
#
# 빌드·올리기 (내 PC):
#   BASE_PATH=/file-version npm run build          # PowerShell: $env:BASE_PATH="/file-version"; npm run build
#   scp -r out/* <사용자>@<공인IP>:/tmp/file-version/
# 서버:
#   sudo mkdir -p /var/www/file-version && sudo cp -r /tmp/file-version/* /var/www/file-version/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 경로 이름을 바꾸려면 BASE_PATH, 아래 location 두 곳, 폴더 이름을 같이 바꾼다

location = /file-version {
    return 301 /file-version/;
}

location /file-version/ {
    root /var/www;                                   # /file-version/x → /var/www/file-version/x
    charset utf-8;                                   # 한글 예시 파일 이름
    try_files $uri $uri.html $uri/index.html =404;   # /file-version/upload → upload.html

    location /file-version/_next/static/ {
        root /var/www;
        expires 1y;                                  # 빌드마다 파일 이름이 바뀌어서 오래 캐시해도 됨
    }
}
